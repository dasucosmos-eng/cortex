<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Brain / Cortex shape -->
  <g transform="translate(64, 64)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
    <!-- Center C -->
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-2">C</text>
    <!-- Neural dots -->
    <circle cx="-28" cy="-20" r="4" fill="white" opacity="0.5"/>
    <circle cx="30" cy="-18" r="3" fill="white" opacity="0.4"/>
    <circle cx="-22" cy="24" r="3.5" fill="white" opacity="0.45"/>
    <circle cx="26" cy="22" r="4" fill="white" opacity="0.5"/>
    <circle cx="0" cy="-34" r="3" fill="white" opacity="0.35"/>
    <!-- Neural connections -->
    <line x1="-28" y1="-20" x2="-10" y2="-12" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <line x1="30" y1="-18" x2="10" y2="-10" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <line x1="-22" y1="24" x2="-8" y2="12" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <line x1="26" y1="22" x2="8" y2="10" stroke="white" stroke-width="1.5" opacity="0.25"/>
    <line x1="0" y1="-34" x2="0" y2="-18" stroke="white" stroke-width="1.5" opacity="0.25"/>
  </g>
</svg>
